<style>
@font-face{font-family:F;src:url(Fredoka.ttf)}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#0a4fd6;font-family:F,Nunito,sans-serif;color:#fff}
#fondo{position:fixed;inset:0;background:radial-gradient(circle at 20% 15%,#5fd0ff 0,#1aa0ff 18%,#0d6ff0 45%,#0a4fd6 80%)}

#ui{position:absolute;right:4vw;top:16vh;display:flex;flex-direction:column;gap:1.2vh;width:34vw}
