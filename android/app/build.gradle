plugins { id 'com.android.application' }

def ksProps = new Properties()
def ksFile = rootProject.file('keystore/keystore.properties')
if (ksFile.exists()) ksFile.withInputStream { ksProps.load(it) }

android {
    namespace 'com.ikeriano.webjuego'
    compileSdk 34
    defaultConfig {
        applicationId 'com.ikeriano.pasapalabra3d.gb'
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName '1.4'
    }
    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile rootProject.file('keystore/' + ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    androidResources { noCompress += ['mp3','mp4','m4a','webp','png','jpg'] }
    lint { abortOnError false; checkReleaseBuilds false }
}
